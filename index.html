<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Dharson Hospital - Orthopaedic Excellence</title>
  <meta name="description" content="Sri Dharson Hospital - Advanced Orthopaedic Care in Namakkal, Tamil Nadu. 24/7 Emergency. +91 9092601760s" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; }
    .rotate-180 { transform: rotate(180deg); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ChevronDown = ({ className }) => (
      <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transition:'transform 0.3s'}}>
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    );
    const PhoneIcon = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.56-.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/>
      </svg>
    );
    const ClockIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    );

    function App() {
      const [showConfirmation, setShowConfirmation] = useState(false);
      const [appointmentData, setAppointmentData] = useState(null);
      const [activeFaq, setActiveFaq] = useState(-1);
      const [formErrors, setFormErrors] = useState({});
      const [counters, setCounters] = useState({ patients: 0, surgeries: 0, doctors: 0, years: 0 });
      const [showEmergency, setShowEmergency] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [formData, setFormData] = useState({ name:'', phone:'', email:'', department:'', date:'', doctor:'', message:'' });

      useEffect(() => {
        const iv = setInterval(() => {
          setCounters(p => ({
            patients: p.patients < 5000 ? p.patients + 50 : 5000,
            surgeries: p.surgeries < 12000 ? p.surgeries + 120 : 12000,
            doctors: p.doctors < 45 ? p.doctors + 1 : 45,
            years: p.years < 20 ? p.years + 0.5 : 20
          }));
        }, 50);
        return () => clearInterval(iv);
      }, []);

      const services = [
        { title:'Knee Replacement', icon:'🦵', desc:'Robotic-assisted minimally invasive surgery', bg:'#dbeafe' },
        { title:'Hip Replacement', icon:'🦴', desc:'Advanced hip care with custom protocols', bg:'#cffafe' },
        { title:'Spine Care', icon:'🩻', desc:'Expert treatment for all spinal conditions', bg:'#ede9fe' },
        { title:'Fracture Treatment', icon:'🚑', desc:'24/7 emergency trauma care', bg:'#fee2e2' },
        { title:'Sports Injury', icon:'⚽', desc:'Athletic rehabilitation programs', bg:'#dcfce7' },
        { title:'Physiotherapy', icon:'💪', desc:'Post-surgery recovery support', bg:'#ffedd5' },
      ];

      const testimonials = [
        { name:'Rajesh Kumar', condition:'Knee Replacement', text:"Dr. Sridhar performed my knee replacement with utmost care. I'm walking normally again after just 6 weeks!", rating:5, img:'👨‍💼' },
        { name:'Meena Singh', condition:'Spine Surgery', text:'The entire team at Sri Dharson was professional and compassionate. My back pain is completely gone.', rating:5, img:'👩‍💼' },
        { name:'Vikram Patel', condition:'Sports Injury', text:"I'm back to playing cricket thanks to their rehabilitation program. Highly recommend!", rating:5, img:'👨‍🦱' },
      ];

      const faqs = [
        { q:'How do I book an appointment?', a:'You can book using our online form, WhatsApp, or call us at +91 87782 31048. Our team will confirm within 24 hours.' },
        { q:'What is the recovery time after knee replacement?', a:'Most patients return to normal activities in 6-8 weeks. Full recovery typically takes 3-6 months with proper physiotherapy.' },
        { q:'Do you have emergency services?', a:'Yes! We provide 24/7 emergency orthopedic care for trauma and acute injuries.' },
        { q:'What insurance does the hospital accept?', a:'We accept all major insurance providers including Aditya Birla, HDFC, ICICI, and others. Call us for specific details.' },
        { q:'Can I get a second opinion?', a:'Absolutely. We encourage second opinions. Our specialists are happy to review your case.' },
      ];

      const validate = () => {
        const e = {};
        if (!formData.name?.trim()) e.name = 'Name is required';
        if (!formData.phone?.trim()) e.phone = 'Phone number is required';
        else if (formData.phone.replace(/\D/g,'').length < 10) e.phone = 'Phone must have at least 10 digits';
        if (!formData.email?.trim()) e.email = 'Email is required';
        else if (!formData.email.includes('@')) e.email = 'Please enter a valid email';
        if (!formData.department?.trim()) e.department = 'Please select a department';
        if (!formData.date?.trim()) e.date = 'Please select a date';
        else {
          const sel = new Date(formData.date); sel.setHours(0,0,0,0);
          const today = new Date(); today.setHours(0,0,0,0);
          if (sel < today) e.date = 'Please select today or a future date';
        }
        return e;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(p => ({...p, [name]: value}));
        if (formErrors[name]) setFormErrors(p => { const n={...p}; delete n[name]; return n; });
      };

      const handleSubmit = () => {
        const errors = validate();
        if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }
        setIsSubmitting(true);
        const msg = `🏥 *NEW APPOINTMENT REQUEST* 🏥\n\n*Patient Details:*\n👤 Name: ${formData.name}\n📱 Phone: ${formData.phone}\n📧 Email: ${formData.email}\n\n*Appointment Details:*\n🏥 Department: ${formData.department}\n📅 Preferred Date: ${formData.date}\n👨‍⚕️ Preferred Doctor: ${formData.doctor || 'Any Available'}\n\n*Additional Notes:*\n${formData.message || 'No additional notes'}\n\n---\nPlease confirm this appointment with the patient as soon as possible.`;
        setTimeout(() => {
          setAppointmentData({...formData});
          setShowConfirmation(true);
          setIsSubmitting(false);
          setFormData({ name:'', phone:'', email:'', department:'', date:'', doctor:'', message:'' });
          window.open(`https://api.whatsapp.com/send?phone=919092601760&text=${encodeURIComponent(msg)}`, '_blank');
        }, 800);
      };

      const handleWhatsApp = () => {
        const errors = validate();
        if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }
        const msg = `Hi SRI DHARSON HOSPITAL,\n\nI would like to book an appointment.\n\nName: ${formData.name}\nPhone: ${formData.phone}\nEmail: ${formData.email}\nDepartment: ${formData.department}\nPreferred Date: ${formData.date}\n\nPlease confirm my appointment.`;
        window.open(`https://api.whatsapp.com/send?phone=918778231048&text=${encodeURIComponent(msg)}`, '_blank');
      };

      const scroll = (id) => document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });

      const inp = (extra='') => `w-full p-4 rounded-2xl border text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 transition-colors ${extra}`;

      return (
        <div className="min-h-screen bg-white text-slate-900">

          {/* Floating Emergency */}
          <div style={{position:'fixed',bottom:'24px',right:'24px',zIndex:40,display:'flex',flexDirection:'column',gap:'12px',alignItems:'flex-end'}}>
            {showEmergency && (
              <div style={{background:'white',borderRadius:'16px',boxShadow:'0 20px 60px rgba(0,0,0,0.2)',padding:'16px',border:'2px solid #ef4444',width:'280px'}}>
                <p style={{fontSize:'14px',fontWeight:'bold',color:'#dc2626',marginBottom:'8px'}}>🚨 24/7 Emergency Care</p>
                <a href="tel:+918778231048" style={{display:'block',background:'#dc2626',color:'white',padding:'10px 16px',borderRadius:'8px',textAlign:'center',fontWeight:'bold',textDecoration:'none',marginBottom:'8px'}}>
                  Call Now: +91 87782 31048
                </a>
                <button onClick={() => setShowEmergency(false)} style={{width:'100%',fontSize:'12px',color:'#94a3b8',background:'none',border:'none',cursor:'pointer'}}>Close</button>
              </div>
            )}
            <button onClick={() => setShowEmergency(!showEmergency)} style={{background:'#dc2626',color:'white',borderRadius:'50%',padding:'16px',boxShadow:'0 10px 30px rgba(220,38,38,0.5)',border:'none',cursor:'pointer',transition:'transform 0.2s'}}
              onMouseOver={e=>e.target.style.transform='scale(1.1)'} onMouseOut={e=>e.target.style.transform='scale(1)'}>
              <PhoneIcon />
            </button>
          </div>

          {/* Confirmation Modal */}
          {showConfirmation && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,padding:'16px'}}>
              <div className="animate-in" style={{background:'white',borderRadius:'24px',padding:'32px',maxWidth:'480px',width:'100%',textAlign:'center',boxShadow:'0 40px 80px rgba(0,0,0,0.3)'}}>
                <div style={{fontSize:'64px',marginBottom:'16px'}}>✅</div>
                <h2 style={{fontSize:'28px',fontWeight:'900',marginBottom:'8px',background:'linear-gradient(135deg,#0891b2,#2563eb)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Appointment Scheduled!</h2>
                <p style={{color:'#374151',marginBottom:'8px',fontWeight:'600'}}>Your request has been sent to our hospital.</p>
                <p style={{color:'#6b7280',marginBottom:'24px',fontSize:'14px'}}>Our team will contact you shortly to confirm.</p>
                <div style={{background:'linear-gradient(135deg,#f0fdf4,#ecfeff)',borderRadius:'16px',padding:'20px',textAlign:'left',marginBottom:'16px',border:'2px solid #bbf7d0'}}>
                  {[['Name',appointmentData?.name],['Phone',appointmentData?.phone],['Department',appointmentData?.department],['Date',appointmentData?.date]].map(([l,v])=>(
                    <div key={l} style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}>
                      <span style={{fontWeight:'bold',color:'#374151'}}>{l}:</span>
                      <span style={{color: l==='Department' ? '#0891b2' : '#6b7280',fontWeight: l==='Department'?'bold':'normal'}}>{v}</span>
                    </div>
                  ))}
                </div>
                <div style={{background:'#eff6ff',border:'2px solid #bfdbfe',borderRadius:'12px',padding:'16px',marginBottom:'20px'}}>
                  <p style={{fontSize:'13px',color:'#1e40af'}}><strong>📱 Appointment message sent via WhatsApp to the hospital</strong></p>
                </div>
                <button onClick={() => setShowConfirmation(false)} style={{width:'100%',background:'linear-gradient(135deg,#06b6d4,#2563eb)',color:'white',padding:'14px',borderRadius:'50px',fontWeight:'900',border:'none',cursor:'pointer',fontSize:'16px'}}>
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Emergency Banner */}
          <div style={{background:'linear-gradient(135deg,#dc2626,#b91c1c)',color:'white',textAlign:'center',padding:'16px',fontWeight:'bold',position:'sticky',top:0,zIndex:40,boxShadow:'0 4px 20px rgba(0,0,0,0.2)'}}>
            🚨 24/7 Emergency Care Available | Call: +91 87782 31048
          </div>

          {/* Header */}
          <header style={{background:'rgba(255,255,255,0.9)',backdropFilter:'blur(20px)',position:'sticky',top:'56px',zIndex:30,boxShadow:'0 1px 10px rgba(0,0,0,0.08)'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <h1 style={{fontSize:'22px',fontWeight:'900',background:'linear-gradient(135deg,#0891b2,#2563eb)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>🏥 SRI DHARSON HOSPITAL</h1>
                <p style={{fontSize:'10px',color:'#94a3b8',fontWeight:'600',letterSpacing:'0.1em'}}>ORTHO HOSPITAL EXCELLENCE</p>
              </div>
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                <button onClick={() => scroll('services')} style={{padding:'8px 16px',fontSize:'14px',fontWeight:'600',color:'#374151',background:'none',border:'none',cursor:'pointer'}}>Services</button>
                <button onClick={() => scroll('doctors')} style={{padding:'8px 16px',fontSize:'14px',fontWeight:'600',color:'#374151',background:'none',border:'none',cursor:'pointer'}}>Doctors</button>
                <button onClick={() => scroll('appointment')} style={{background:'linear-gradient(135deg,#06b6d4,#2563eb)',color:'white',padding:'10px 24px',borderRadius:'50px',fontWeight:'bold',fontSize:'14px',border:'none',cursor:'pointer',boxShadow:'0 4px 15px rgba(6,182,212,0.4)'}}>
                  Book Now
                </button>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section style={{background:'linear-gradient(135deg,#0f172a,#1e3a5f,#164e63)',color:'white',padding:'96px 0',position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:0,opacity:0.15}}>
              <div style={{position:'absolute',top:'80px',left:'40px',width:'288px',height:'288px',background:'#22d3ee',borderRadius:'50%',filter:'blur(80px)'}}></div>
              <div style={{position:'absolute',bottom:'40px',right:'40px',width:'384px',height:'384px',background:'#3b82f6',borderRadius:'50%',filter:'blur(80px)'}}></div>
            </div>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'48px',alignItems:'center',position:'relative',zIndex:10}}>
              <div>
                <h2 style={{fontSize:'clamp(36px,5vw,64px)',fontWeight:'900',lineHeight:'1.1',marginBottom:'24px'}}>Advanced Orthopaedic Care</h2>
                <p style={{fontSize:'18px',color:'#cbd5e1',marginBottom:'32px',lineHeight:'1.7'}}>World-class orthopedic treatment with expert surgeons, cutting-edge technology, and compassionate care. Get back to life faster.</p>
                <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
                  <button onClick={() => scroll('appointment')} style={{background:'#22d3ee',color:'#0f172a',padding:'16px 32px',borderRadius:'50px',fontWeight:'900',fontSize:'18px',border:'none',cursor:'pointer',boxShadow:'0 10px 30px rgba(34,211,238,0.4)'}}>
                    Schedule Appointment
                  </button>
                  <button onClick={() => scroll('doctors')} style={{border:'2px solid #22d3ee',color:'#22d3ee',padding:'16px 32px',borderRadius:'50px',fontWeight:'900',fontSize:'18px',background:'none',cursor:'pointer'}}>
                    Meet Specialists
                  </button>
                </div>
              </div>
              <div>
                <img src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1200&auto=format&fit=crop" alt="Hospital" style={{borderRadius:'24px',boxShadow:'0 30px 60px rgba(0,0,0,0.4)',width:'100%',height:'380px',objectFit:'cover'}} />
              </div>
            </div>
          </section>

          {/* Stats */}
          <section style={{padding:'80px 0',background:'white'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'32px'}}>
              {[
                {label:'Happy Patients',value:counters.patients,icon:'👥'},
                {label:'Successful Surgeries',value:counters.surgeries,icon:'✅'},
                {label:'Expert Doctors',value:counters.doctors,icon:'👨‍⚕️'},
                {label:'Years of Experience',value:Math.round(counters.years),icon:'⭐'},
              ].map((s,i) => (
                <div key={i} style={{textAlign:'center',padding:'32px',borderRadius:'20px',background:'linear-gradient(135deg,#eff6ff,#ecfeff)',border:'1px solid #bfdbfe'}}>
                  <div style={{fontSize:'48px',marginBottom:'16px'}}>{s.icon}</div>
                  <p style={{fontSize:'36px',fontWeight:'900',background:'linear-gradient(135deg,#0891b2,#2563eb)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{s.value.toLocaleString()}</p>
                  <p style={{color:'#475569',fontWeight:'600',marginTop:'8px'}}>{s.label}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Services */}
          <section id="services" style={{padding:'96px 0',background:'#f8fafc'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{textAlign:'center',marginBottom:'64px'}}>
                <h2 style={{fontSize:'48px',fontWeight:'900',marginBottom:'16px'}}>Our Services</h2>
                <p style={{fontSize:'20px',color:'#64748b'}}>Comprehensive orthopedic care for all bone and joint conditions</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'32px'}}>
                {services.map((s,i) => (
                  <div key={i} style={{background:s.bg,borderRadius:'24px',padding:'32px',boxShadow:'0 4px 20px rgba(0,0,0,0.06)',cursor:'pointer',transition:'all 0.3s'}}
                    onMouseOver={e=>{e.currentTarget.style.transform='translateY(-8px)';e.currentTarget.style.boxShadow='0 20px 40px rgba(0,0,0,0.12)'}}
                    onMouseOut={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 20px rgba(0,0,0,0.06)'}}>
                    <div style={{fontSize:'56px',marginBottom:'24px'}}>{s.icon}</div>
                    <h3 style={{fontSize:'22px',fontWeight:'900',marginBottom:'12px'}}>{s.title}</h3>
                    <p style={{color:'#475569',fontWeight:'500'}}>{s.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Doctor */}
          <section id="doctors" style={{padding:'96px 0',background:'white'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{textAlign:'center',marginBottom:'64px'}}>
                <h2 style={{fontSize:'48px',fontWeight:'900',marginBottom:'16px'}}>Our Specialists</h2>
                <p style={{fontSize:'20px',color:'#64748b'}}>Highly qualified and experienced orthopedic experts</p>
              </div>
              <div style={{display:'flex',justifyContent:'center'}}>
                <div style={{borderRadius:'24px',overflow:'hidden',boxShadow:'0 20px 40px rgba(0,0,0,0.1)',maxWidth:'400px',width:'100%',border:'4px solid #22d3ee'}}>
                  <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?q=80&w=1200&auto=format&fit=crop" alt="Dr. D. Sridhar" style={{width:'100%',height:'320px',objectFit:'cover'}} />
                  <div style={{padding:'32px',background:'linear-gradient(to bottom,white,#f8fafc)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
                      <h3 style={{fontSize:'24px',fontWeight:'900'}}>Dr. D. Sridhar</h3>
                      <span style={{color:'#eab308',fontWeight:'900'}}>★ 4.9</span>
                    </div>
                    <p style={{color:'#0891b2',fontWeight:'bold',marginBottom:'12px'}}>Orthopaedic Surgeon</p>
                    <p style={{fontSize:'14px',color:'#475569',marginBottom:'12px'}}>📚 D.Ortho, MS.Ortho, DNB.Ortho, Fellow.Ilizarov</p>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'14px',color:'#64748b',background:'#eff6ff',padding:'12px',borderRadius:'12px'}}>
                      <ClockIcon /> Mon - Sun, 24 Hours
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Testimonials */}
          <section style={{padding:'96px 0',background:'linear-gradient(to bottom,#eff6ff,white)'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{textAlign:'center',marginBottom:'64px'}}>
                <h2 style={{fontSize:'48px',fontWeight:'900',marginBottom:'16px'}}>Patient Stories</h2>
                <p style={{fontSize:'20px',color:'#64748b'}}>Real experiences from our satisfied patients</p>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'32px'}}>
                {testimonials.map((t,i) => (
                  <div key={i} style={{background:'white',borderRadius:'24px',padding:'32px',boxShadow:'0 4px 20px rgba(0,0,0,0.06)',border:'1px solid #dbeafe'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'16px'}}>
                      <div style={{fontSize:'48px'}}>{t.img}</div>
                      <div>
                        <p style={{fontWeight:'bold',fontSize:'18px'}}>{t.name}</p>
                        <p style={{fontSize:'13px',color:'#94a3b8'}}>{t.condition}</p>
                      </div>
                    </div>
                    <div style={{marginBottom:'16px'}}>{'★★★★★'.split('').map((_,j)=><span key={j} style={{color:'#fbbf24',fontSize:'20px'}}>★</span>)}</div>
                    <p style={{color:'#374151',fontStyle:'italic'}}>"{t.text}"</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FAQ */}
          <section style={{padding:'96px 0',background:'white'}}>
            <div style={{maxWidth:'896px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{textAlign:'center',marginBottom:'64px'}}>
                <h2 style={{fontSize:'48px',fontWeight:'900'}}>Frequently Asked Questions</h2>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
                {faqs.map((faq,i) => (
                  <div key={i} style={{border:`2px solid ${activeFaq===i?'#22d3ee':'#e2e8f0'}`,borderRadius:'16px',overflow:'hidden',transition:'border-color 0.3s'}}>
                    <button onClick={() => setActiveFaq(activeFaq===i?-1:i)} style={{width:'100%',padding:'24px',display:'flex',alignItems:'center',justifyContent:'space-between',background:activeFaq===i?'#f0f9ff':'white',border:'none',cursor:'pointer',textAlign:'left'}}>
                      <p style={{fontSize:'17px',fontWeight:'bold'}}>{faq.q}</p>
                      <div style={{transform:activeFaq===i?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.3s',flexShrink:0,marginLeft:'16px'}}>
                        <ChevronDown />
                      </div>
                    </button>
                    {activeFaq === i && (
                      <div style={{padding:'0 24px 24px',background:'#f0f9ff',borderTop:'2px solid #e2e8f0'}}>
                        <p style={{color:'#374151',lineHeight:'1.7'}}>{faq.a}</p>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Appointment */}
          <section id="appointment" style={{padding:'96px 0',background:'linear-gradient(to bottom,#0f172a,#1e3a5f)'}}>
            <div style={{maxWidth:'896px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{background:'rgba(255,255,255,0.08)',backdropFilter:'blur(20px)',borderRadius:'40px',padding:'48px',border:'1px solid rgba(255,255,255,0.15)',boxShadow:'0 40px 80px rgba(0,0,0,0.3)'}}>
                <h2 style={{fontSize:'40px',fontWeight:'900',textAlign:'center',marginBottom:'12px',color:'white'}}>Book Your Appointment</h2>
                <p style={{textAlign:'center',color:'#94a3b8',marginBottom:'40px'}}>Schedule a consultation with our expert specialists</p>
                <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
                    <div>
                      <input type="text" name="name" value={formData.name} onChange={handleChange} placeholder="Full Name *"
                        style={{width:'100%',padding:'16px',borderRadius:'16px',background:'rgba(255,255,255,0.1)',border:`1px solid ${formErrors.name?'#f87171':'rgba(255,255,255,0.2)'}`,color:'white',fontSize:'16px',outline:'none'}} />
                      {formErrors.name && <p style={{color:'#fca5a5',fontSize:'13px',marginTop:'6px'}}>⚠️ {formErrors.name}</p>}
                    </div>
                    <div>
                      <input type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="Phone Number *"
                        style={{width:'100%',padding:'16px',borderRadius:'16px',background:'rgba(255,255,255,0.1)',border:`1px solid ${formErrors.phone?'#f87171':'rgba(255,255,255,0.2)'}`,color:'white',fontSize:'16px',outline:'none'}} />
                      {formErrors.phone && <p style={{color:'#fca5a5',fontSize:'13px',marginTop:'6px'}}>⚠️ {formErrors.phone}</p>}
                    </div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
                    <div>
                      <input type="email" name="email" value={formData.email} onChange={handleChange} placeholder="Email Address *"
                        style={{width:'100%',padding:'16px',borderRadius:'16px',background:'rgba(255,255,255,0.1)',border:`1px solid ${formErrors.email?'#f87171':'rgba(255,255,255,0.2)'}`,color:'white',fontSize:'16px',outline:'none'}} />
                      {formErrors.email && <p style={{color:'#fca5a5',fontSize:'13px',marginTop:'6px'}}>⚠️ {formErrors.email}</p>}
                    </div>
                    <div>
                      <select name="department" value={formData.department} onChange={handleChange}
                        style={{width:'100%',padding:'16px',borderRadius:'16px',background:'#1e3a5f',border:`1px solid ${formErrors.department?'#f87171':'rgba(255,255,255,0.2)'}`,color:'white',fontSize:'16px',outline:'none'}}>
                        <option value="">Select Department *</option>
                        {['Knee Replacement','Hip Replacement','Spine Care','Fracture Treatment','Sports Injury'].map(d=>(
                          <option key={d} value={d}>{d}</option>
                        ))}
                      </select>
                      {formErrors.department && <p style={{color:'#fca5a5',fontSize:'13px',marginTop:'6px'}}>⚠️ {formErrors.department}</p>}
                    </div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
                    <div>
                      <input type="date" name="date" value={formData.date} onChange={handleChange}
                        style={{width:'100%',padding:'16px',borderRadius:'16px',background:'rgba(255,255,255,0.1)',border:`1px solid ${formErrors.date?'#f87171':'rgba(255,255,255,0.2)'}`,color:'white',fontSize:'16px',outline:'none'}} />
                      {formErrors.date && <p style={{color:'#fca5a5',fontSize:'13px',marginTop:'6px'}}>⚠️ {formErrors.date}</p>}
                    </div>
                    <select name="doctor" value={formData.doctor} onChange={handleChange}
                      style={{width:'100%',padding:'16px',borderRadius:'16px',background:'#1e3a5f',border:'1px solid rgba(255,255,255,0.2)',color:'white',fontSize:'16px',outline:'none'}}>
                      <option value="">Select Doctor (Optional)</option>
                      <option value="Dr. D. Sridhar">Dr. D. Sridhar</option>
                    </select>
                  </div>
                  <textarea name="message" value={formData.message} onChange={handleChange} placeholder="Describe your condition or medical history..." rows="4"
                    style={{width:'100%',padding:'16px',borderRadius:'16px',background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.2)',color:'white',fontSize:'16px',outline:'none',resize:'vertical'}} />
                  <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                    <button onClick={handleSubmit} disabled={isSubmitting}
                      style={{width:'100%',background:'linear-gradient(135deg,#06b6d4,#2563eb)',color:'white',padding:'18px',borderRadius:'16px',fontWeight:'900',fontSize:'18px',border:'none',cursor:isSubmitting?'not-allowed':'pointer',opacity:isSubmitting?0.6:1,boxShadow:'0 10px 30px rgba(6,182,212,0.4)'}}>
                      {isSubmitting ? '⏳ Processing...' : '✅ Confirm Appointment'}
                    </button>
                    <button onClick={handleWhatsApp}
                      style={{width:'100%',background:'#22c55e',color:'white',padding:'18px',borderRadius:'16px',fontWeight:'900',fontSize:'18px',border:'none',cursor:'pointer',boxShadow:'0 10px 30px rgba(34,197,94,0.4)'}}>
                      💬 Book via WhatsApp
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer style={{background:'#020617',color:'white',padding:'80px 0'}}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 24px'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'48px',marginBottom:'48px'}}>
                <div>
                  <h3 style={{fontSize:'28px',fontWeight:'900',marginBottom:'32px',background:'linear-gradient(135deg,#22d3ee,#60a5fa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>📍 Location</h3>
                  <a href="https://maps.app.goo.gl/8bDWSszrfBM7e1mK8?g_st=aw" target="_blank" rel="noopener noreferrer"
                    style={{display:'block',background:'linear-gradient(135deg,#0891b2,#2563eb)',borderRadius:'24px',padding:'32px',textDecoration:'none',boxShadow:'0 20px 40px rgba(0,0,0,0.3)'}}>
                    <div style={{fontSize:'56px',marginBottom:'16px'}}>📍</div>
                    <h4 style={{fontSize:'22px',fontWeight:'900',color:'white',marginBottom:'8px'}}>SRI DHARSON HOSPITAL</h4>
                    <p style={{color:'rgba(255,255,255,0.85)',marginBottom:'16px'}}>Namakkal, Tamil Nadu, India</p>
                    <span style={{background:'white',color:'#0891b2',padding:'10px 24px',borderRadius:'50px',fontWeight:'bold',display:'inline-block'}}>Open in Google Maps</span>
                  </a>
                </div>
                <div>
                  <h3 style={{fontSize:'28px',fontWeight:'900',marginBottom:'32px',background:'linear-gradient(135deg,#22d3ee,#60a5fa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>📞 Contact Info</h3>
                  <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
                    <div style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'20px'}}>
                      <p style={{color:'#94a3b8',fontSize:'12px',fontWeight:'600',marginBottom:'6px'}}>Hospital Name</p>
                      <h4 style={{fontSize:'20px',fontWeight:'900'}}>SRI DHARSON HOSPITAL</h4>
                    </div>
                    <a href="tel:+918778231048" style={{display:'block',background:'linear-gradient(135deg,#06b6d4,#2563eb)',borderRadius:'16px',padding:'20px',textDecoration:'none'}}>
                      <p style={{color:'rgba(255,255,255,0.7)',fontSize:'12px',fontWeight:'600',marginBottom:'4px'}}>Emergency & Appointments</p>
                      <p style={{fontSize:'26px',fontWeight:'900',color:'white'}}>+91 87782 31048</p>
                    </a>
                    <div style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'20px'}}>
                      <p style={{color:'#94a3b8',fontSize:'12px',fontWeight:'600',marginBottom:'4px'}}>📍 Location</p>
                      <p style={{fontSize:'16px',fontWeight:'600'}}>Namakkal, Tamil Nadu, India</p>
                    </div>
                    <a href="mailto:sridharsonhospital@gmail.com" style={{display:'block',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'16px',padding:'20px',textDecoration:'none'}}>
                      <p style={{color:'#94a3b8',fontSize:'12px',fontWeight:'600',marginBottom:'4px'}}>📧 Email Us</p>
                      <p style={{fontSize:'15px',fontWeight:'bold',color:'#67e8f9'}}>sridharsonhospital@gmail.com</p>
                    </a>
                    <div style={{background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:'16px',padding:'20px'}}>
                      <p style={{color:'#cbd5e1',fontSize:'12px',fontWeight:'600',marginBottom:'4px'}}>🚨 Emergency Support</p>
                      <p style={{fontSize:'22px',fontWeight:'900',color:'#fca5a5'}}>24/7 Available</p>
                    </div>
                  </div>
                </div>
              </div>
              <div style={{borderTop:'1px solid rgba(255,255,255,0.1)',paddingTop:'32px',textAlign:'center',color:'#94a3b8',fontSize:'14px'}}>
                <p style={{marginBottom:'8px'}}>© 2026 SRI DHARSON HOSPITAL. All Rights Reserved.</p>
                <p style={{fontSize:'12px'}}>🏥 Ortho Hospital | Trusted by 5000+ Patients</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

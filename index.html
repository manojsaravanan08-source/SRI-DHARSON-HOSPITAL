<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Dharson Hospital - Orthopaedic Excellence</title>
  <meta name="description" content="Sri Dharson Hospital - Advanced Orthopaedic Care in Namakkal, Tamil Nadu. 24/7 Emergency. +91 90926 01760" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: #fff; color: #0f172a; -webkit-font-smoothing: antialiased; }

    /* ── Utility ── */
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .container { padding: 0 24px; } }
    @media (min-width: 1024px) { .container { padding: 0 40px; } }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); } 50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); } }
    @keyframes countUp { from { opacity:0; } to { opacity:1; } }
    .fade-in { animation: fadeUp 0.5s ease forwards; }

    /* ── Emergency Banner ── */
    .em-banner {
      background: linear-gradient(90deg, #b91c1c, #dc2626, #b91c1c);
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    @media (min-width: 640px) { .em-banner { font-size: 14px; } }

    /* ── Header ── */
    .header {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      position: sticky;
      top: 37px;
      z-index: 99;
    }
    @media (min-width: 640px) { .header { top: 41px; } }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      gap: 12px;
    }
    @media (min-width: 640px) { .header-inner { padding: 14px 24px; } }
    @media (min-width: 1024px) { .header-inner { padding: 16px 40px; } }
    .logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    @media (min-width: 640px) { .logo-name { font-size: 19px; } }
    .logo-sub { font-size: 9px; color: #94a3b8; font-weight: 600; letter-spacing: 0.12em; margin-top: 2px; }
    .nav { display: none; gap: 4px; }
    @media (min-width: 768px) { .nav { display: flex; } }
    .nav button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .nav button:hover { color: #0891b2; background: #f0f9ff; }
    .book-btn {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff !important;
      padding: 9px 18px !important;
      border-radius: 50px !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(6,182,212,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    @media (min-width: 640px) { .book-btn { padding: 10px 24px !important; font-size: 14px !important; } }
    .book-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(6,182,212,0.45); }

    /* Mobile menu */
    .mobile-menu-btn {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }
    @media (min-width: 768px) { .mobile-menu-btn { display: none; } }
    .mobile-menu-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: #475569;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .mobile-nav {
      display: none;
      flex-direction: column;
      padding: 12px 16px 16px;
      border-top: 1px solid #f1f5f9;
      gap: 4px;
    }
    .mobile-nav.open { display: flex; }
    @media (min-width: 768px) { .mobile-nav { display: none !important; } }
    .mobile-nav button {
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s, color 0.2s;
    }
    .mobile-nav button:hover { background: #f0f9ff; color: #0891b2; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(150deg, #0f172a 0%, #1e3a5f 50%, #164e63 100%);
      color: #fff;
      padding: 52px 0 48px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -80px; left: -80px;
      width: 400px; height: 400px;
      background: #22d3ee;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -60px;
      width: 500px; height: 500px;
      background: #3b82f6;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
    }
    .hero-grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      z-index: 1;
    }
    @media (min-width: 900px) { .hero-grid { flex-direction: row; align-items: center; gap: 48px; } }
    .hero-text { flex: 1; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,211,238,0.15);
      border: 1px solid rgba(34,211,238,0.3);
      color: #67e8f9;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    .hero h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(30px, 6vw, 58px);
      font-weight: 800;
      line-height: 1.08;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: clamp(14px, 2vw, 17px);
      color: #94a3b8;
      line-height: 1.75;
      margin-bottom: 28px;
      max-width: 500px;
    }
    .hero-btns { display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 400px) { .hero-btns { flex-direction: row; flex-wrap: wrap; } }
    .btn-cta {
      background: #22d3ee;
      color: #0f172a;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(34,211,238,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(34,211,238,0.45); }
    .btn-ghost {
      background: transparent;
      color: #22d3ee;
      border: 2px solid rgba(34,211,238,0.5);
      padding: 13px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: #22d3ee; background: rgba(34,211,238,0.08); }
    .hero-img {
      flex: 1;
      max-width: 100%;
    }
    .hero-img img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    @media (min-width: 640px) { .hero-img img { height: 320px; } }
    @media (min-width: 900px) { .hero-img img { height: 400px; } }

    /* ── Stats ── */
    .stats-section { padding: 56px 0; background: #fff; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: linear-gradient(135deg, #eff6ff, #ecfeff);
      border: 1px solid #bfdbfe;
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); }
    .stat-icon { font-size: 36px; margin-bottom: 10px; }
    @media (min-width: 640px) { .stat-icon { font-size: 44px; } }
    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @media (min-width: 640px) { .stat-num { font-size: 32px; } }
    .stat-label { color: #64748b; font-size: 12px; font-weight: 500; margin-top: 6px; }
    @media (min-width: 640px) { .stat-label { font-size: 14px; } }

    /* ── Services ── */
    .services-section { padding: 72px 0; background: #f8fafc; }
    .section-header { text-align: center; margin-bottom: 48px; }
    .section-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .section-header p { font-size: 15px; color: #64748b; max-width: 500px; margin: 0 auto; }
    @media (min-width: 640px) { .section-header p { font-size: 17px; } }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 640px) { .services-grid { gap: 20px; } }
    @media (min-width: 900px) { .services-grid { grid-template-columns: repeat(3, 1fr); } }
    .service-card {
      border-radius: 20px;
      padding: 24px 18px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    @media (min-width: 640px) { .service-card { padding: 28px 22px; } }
    .service-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
    .service-icon { font-size: 40px; margin-bottom: 16px; display: block; }
    @media (min-width: 640px) { .service-icon { font-size: 48px; margin-bottom: 20px; } }
    .service-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    @media (min-width: 640px) { .service-title { font-size: 18px; } }
    .service-desc { color: #475569; font-size: 12px; font-weight: 400; line-height: 1.5; }
    @media (min-width: 640px) { .service-desc { font-size: 14px; } }

    /* ── Doctor ── */
    .doctors-section { padding: 72px 0; background: #fff; }
    .doctor-card-wrap { display: flex; justify-content: center; }
    .doctor-card {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 340px;
      border: 3px solid #22d3ee;
      transition: transform 0.3s;
    }
    .doctor-card:hover { transform: translateY(-6px); }
    .doctor-card img { width: 100%; height: 260px; object-fit: cover; object-position: top; display: block; }
    @media (min-width: 640px) { .doctor-card img { height: 300px; } }
    .doctor-info { padding: 24px; background: #fff; }
    .doctor-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .doctor-name { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; }
    .doctor-rating { color: #fbbf24; font-weight: 700; font-size: 15px; }
    .doctor-role { color: #0891b2; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
    .doctor-qual { font-size: 13px; color: #64748b; margin-bottom: 12px; line-height: 1.5; }
    .doctor-hours {
      background: #eff6ff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Testimonials ── */
    .testi-section { padding: 72px 0; background: linear-gradient(to bottom, #eff6ff, #fff); }
    .testi-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 640px) { .testi-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    @media (min-width: 1024px) { .testi-grid { grid-template-columns: repeat(3, 1fr); } }
    .testi-card {
      background: #fff;
      border: 1px solid #dbeafe;
      border-radius: 20px;
      padding: 24px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .testi-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    .testi-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .testi-avatar { font-size: 40px; line-height: 1; }
    .testi-name { font-weight: 700; font-size: 16px; }
    .testi-condition { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .stars { color: #fbbf24; font-size: 16px; margin-bottom: 10px; letter-spacing: 1px; }
    .testi-text { color: #374151; font-style: italic; font-size: 14px; line-height: 1.65; }

    /* ── FAQ ── */
    .faq-section { padding: 72px 0; background: #fff; }
    .faq-wrap { max-width: 760px; margin: 0 auto; }
    .faq-item {
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.3s;
      margin-bottom: 12px;
    }
    .faq-item.open { border-color: #22d3ee; }
    .faq-btn {
      width: 100%;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .faq-item.open .faq-btn { background: #f0f9ff; }
    .faq-q-text { font-size: 14px; font-weight: 600; color: #0f172a; line-height: 1.4; }
    @media (min-width: 640px) { .faq-q-text { font-size: 16px; } }
    .faq-chevron {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      transition: transform 0.3s;
      color: #64748b;
    }
    .faq-item.open .faq-chevron { transform: rotate(180deg); }
    .faq-answer {
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.3s;
      background: #f0f9ff;
      font-size: 14px;
      color: #374151;
      line-height: 1.7;
    }
    .faq-answer.open { max-height: 200px; padding: 4px 20px 20px; border-top: 1px solid #e2e8f0; }

    /* ── Appointment ── */
    .appt-section { padding: 72px 0; background: linear-gradient(to bottom, #0f172a, #1e3a5f); }
    .appt-box {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 28px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    @media (min-width: 640px) { .appt-box { padding: 40px 36px; } }
    .appt-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
    }
    .appt-sub { text-align: center; color: #94a3b8; margin-bottom: 28px; font-size: 14px; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (min-width: 600px) { .form-row { grid-template-columns: 1fr 1fr; } }
    .form-field { display: flex; flex-direction: column; }
    .appt-input, .appt-select, .appt-textarea {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .appt-input::placeholder, .appt-textarea::placeholder { color: #64748b; }
    .appt-input:focus, .appt-select:focus, .appt-textarea:focus { border-color: #22d3ee; }
    .appt-select { background-color: #1a3a5c; cursor: pointer; }
    .appt-select option { background: #1e3a5f; color: #fff; }
    .appt-input.error, .appt-select.error { border-color: #f87171; }
    .err-msg { color: #fca5a5; font-size: 12px; margin-top: 4px; }
    .appt-textarea { resize: vertical; min-height: 100px; }
    .form-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
    .confirm-btn {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff;
      padding: 15px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(6,182,212,0.35);
      transition: transform 0.2s, opacity 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .confirm-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .confirm-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .wa-btn {
      width: 100%;
      background: #22c55e;
      color: #fff;
      padding: 15px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(34,197,94,0.3);
      transition: transform 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .wa-btn:hover { transform: translateY(-2px); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0,0,0,0.3);
      animation: fadeUp 0.3s ease;
    }
    @media (min-width: 480px) { .modal { padding: 36px 32px; } }
    .modal-icon { font-size: 56px; margin-bottom: 12px; }
    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal-sub { color: #374151; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
    .modal-note { color: #6b7280; margin-bottom: 20px; font-size: 13px; }
    .modal-details {
      background: linear-gradient(135deg, #f0fdf4, #ecfeff);
      border: 2px solid #bbf7d0;
      border-radius: 14px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 14px;
    }
    .modal-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .modal-row:last-child { margin-bottom: 0; }
    .modal-row-label { font-weight: 700; color: #374151; }
    .modal-row-val { color: #6b7280; }
    .modal-wa-note {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #1e40af;
      margin-bottom: 18px;
    }
    .modal-close-btn {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #fff;
      padding: 14px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Floating Emergency Button ── */
    .fab-wrap { position: fixed; bottom: 24px; right: 16px; z-index: 150; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    @media (min-width: 640px) { .fab-wrap { right: 24px; } }
    .fab-popup {
      background: #fff;
      border: 2px solid #ef4444;
      border-radius: 14px;
      padding: 14px;
      width: 240px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    }
    @media (min-width: 360px) { .fab-popup { width: 260px; } }
    .fab-popup-title { font-size: 13px; font-weight: 700; color: #dc2626; margin-bottom: 8px; }
    .fab-call-btn {
      display: block;
      background: #dc2626;
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .fab-close-btn { width: 100%; font-size: 11px; color: #94a3b8; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .fab-btn {
      background: #dc2626;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      animation: pulse 2s infinite;
      box-shadow: 0 6px 20px rgba(220,38,38,0.4);
      transition: transform 0.2s;
    }
    .fab-btn:hover { transform: scale(1.08); }

    /* ── Footer ── */
    .footer { background: #020617; color: #fff; padding: 56px 0 40px; }
    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      margin-bottom: 40px;
    }
    @media (min-width: 640px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
    .footer-section-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #22d3ee, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .map-card {
      display: block;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      border-radius: 18px;
      padding: 24px;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .map-card:hover { transform: translateY(-3px); }
    .map-icon { font-size: 44px; margin-bottom: 12px; display: block; }
    .map-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .map-addr { color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 14px; }
    .map-cta { background: #fff; color: #0891b2; padding: 8px 20px; border-radius: 50px; font-weight: 700; font-size: 13px; display: inline-block; }
    .contact-items { display: flex; flex-direction: column; gap: 10px; }
    .contact-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
    }
    .contact-item.highlight { background: linear-gradient(135deg, #06b6d4, #2563eb); border: none; }
    .contact-item.danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); }
    .contact-label { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 3px; }
    .contact-value { font-size: 16px; font-weight: 700; color: #fff; }
    .contact-value.lg { font-size: 20px; }
    .contact-value.teal { color: #67e8f9; font-size: 13px; }
    .contact-value.red { color: #fca5a5; font-size: 20px; }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 24px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [showConfirmation, setShowConfirmation] = useState(false);
      const [appointmentData, setAppointmentData] = useState(null);
      const [openFaq, setOpenFaq] = useState(-1);
      const [formErrors, setFormErrors] = useState({});
      const [counters, setCounters] = useState({ patients: 0, surgeries: 0, doctors: 0, years: 0 });
      const [showEmergency, setShowEmergency] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [formData, setFormData] = useState({ name:'', phone:'', email:'', department:'', date:'', doctor:'', message:'' });

      useEffect(() => {
        const targets = { patients: 5000, surgeries: 12000, doctors: 45, years: 20 };
        const steps = { patients: 60, surgeries: 150, doctors: 1, years: 0.5 };
        const iv = setInterval(() => {
          setCounters(p => {
            const n = {
              patients: Math.min(p.patients + steps.patients, targets.patients),
              surgeries: Math.min(p.surgeries + steps.surgeries, targets.surgeries),
              doctors: Math.min(p.doctors + steps.doctors, targets.doctors),
              years: Math.min(p.years + steps.years, targets.years),
            };
            if (n.patients === targets.patients && n.surgeries === targets.surgeries) clearInterval(iv);
            return n;
          });
        }, 40);
        return () => clearInterval(iv);
      }, []);

      const services = [
        { title:'Knee Replacement', icon:'🦵', desc:'Robotic-assisted minimally invasive surgery', bg:'#dbeafe' },
        { title:'Hip Replacement', icon:'🦴', desc:'Advanced hip care with custom protocols', bg:'#cffafe' },
        { title:'Spine Care', icon:'🩻', desc:'Expert treatment for all spinal conditions', bg:'#ede9fe' },
        { title:'Fracture Treatment', icon:'🚑', desc:'24/7 emergency trauma care', bg:'#fee2e2' },
        { title:'Sports Injury', icon:'⚽', desc:'Athletic rehabilitation programs', bg:'#dcfce7' },
        { title:'Physiotherapy', icon:'💪', desc:'Post-surgery recovery support', bg:'#ffedd5' },
      ];

      const testimonials = [
        { name:'Rajesh Kumar', condition:'Knee Replacement', text:"Dr. Sridhar performed my knee replacement with utmost care. I'm walking normally again after just 6 weeks!", img:'👨‍💼' },
        { name:'Meena Singh', condition:'Spine Surgery', text:'The entire team at Sri Dharson was professional and compassionate. My back pain is completely gone.', img:'👩‍💼' },
        { name:'Vikram Patel', condition:'Sports Injury', text:"I'm back to playing cricket thanks to their rehabilitation program. Highly recommend!", img:'👨‍🦱' },
      ];

      const faqs = [
        { q:'How do I book an appointment?', a:'You can book using our online form, WhatsApp, or call us at +91 90926 01760. Our team will confirm within 24 hours.' },
        { q:'What is the recovery time after knee replacement?', a:'Most patients return to normal activities in 6–8 weeks. Full recovery typically takes 3–6 months with proper physiotherapy.' },
        { q:'Do you have emergency services?', a:'Yes! We provide 24/7 emergency orthopedic care for trauma and acute injuries.' },
        { q:'What insurance does the hospital accept?', a:'We accept all major insurance providers including Aditya Birla, HDFC, ICICI, and others. Call us for specific details.' },
        { q:'Can I get a second opinion?', a:'Absolutely. We encourage second opinions. Our specialists are happy to review your case.' },
      ];

      const validate = () => {
        const e = {};
        if (!formData.name?.trim()) e.name = 'Name is required';
        if (!formData.phone?.trim()) e.phone = 'Phone number is required';
        else if (formData.phone.replace(/\D/g,'').length < 10) e.phone = 'Enter a valid 10-digit number';
        if (!formData.email?.trim()) e.email = 'Email is required';
        else if (!/\S+@\S+\.\S+/.test(formData.email)) e.email = 'Enter a valid email address';
        if (!formData.department) e.department = 'Please select a department';
        if (!formData.date) e.date = 'Please select a date';
        else {
          const sel = new Date(formData.date); sel.setHours(0,0,0,0);
          const today = new Date(); today.setHours(0,0,0,0);
          if (sel < today) e.date = 'Please select today or a future date';
        }
        return e;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(p => ({...p, [name]: value}));
        if (formErrors[name]) setFormErrors(p => { const n={...p}; delete n[name]; return n; });
      };

      const handleSubmit = () => {
        const errors = validate();
        if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }
        setIsSubmitting(true);
        const msg = `🏥 *NEW APPOINTMENT REQUEST*\n\n👤 Name: ${formData.name}\n📱 Phone: ${formData.phone}\n📧 Email: ${formData.email}\n🏥 Department: ${formData.department}\n📅 Date: ${formData.date}\n👨‍⚕️ Doctor: ${formData.doctor || 'Any Available'}\n\n${formData.message ? 'Notes: ' + formData.message : ''}`;
        setTimeout(() => {
          setAppointmentData({...formData});
          setShowConfirmation(true);
          setIsSubmitting(false);
          setFormData({ name:'', phone:'', email:'', department:'', date:'', doctor:'', message:'' });
          window.open(`https://api.whatsapp.com/send?phone=919092601760&text=${encodeURIComponent(msg)}`, '_blank');
        }, 800);
      };

      const handleWhatsApp = () => {
        const errors = validate();
        if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }
        const msg = `Hi Sri Dharson Hospital,\n\nI'd like to book an appointment.\n\nName: ${formData.name}\nPhone: ${formData.phone}\nEmail: ${formData.email}\nDepartment: ${formData.department}\nPreferred Date: ${formData.date}\n\nPlease confirm.`;
        window.open(`https://api.whatsapp.com/send?phone=918778231048&text=${encodeURIComponent(msg)}`, '_blank');
      };

      const scroll = (id) => {
        document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
        setMobileNavOpen(false);
      };

      return (
        <div style={{minHeight:'100vh',background:'#fff',color:'#0f172a'}}>

          {/* Floating Emergency Button */}
          <div className="fab-wrap">
            {showEmergency && (
              <div className="fab-popup">
                <p className="fab-popup-title">🚨 24/7 Emergency Care</p>
                <a href="tel:+919092601760" className="fab-call-btn">📞 +91 90926 01760</a>
                <button onClick={() => setShowEmergency(false)} className="fab-close-btn">Close</button>
              </div>
            )}
            <button onClick={() => setShowEmergency(!showEmergency)} className="fab-btn" aria-label="Emergency contact">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.56-.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/>
              </svg>
            </button>
          </div>

          {/* Confirmation Modal */}
          {showConfirmation && (
            <div className="modal-backdrop" onClick={() => setShowConfirmation(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-icon">✅</div>
                <h2 className="modal-title">Appointment Scheduled!</h2>
                <p className="modal-sub">Your request has been sent to our hospital.</p>
                <p className="modal-note">Our team will contact you shortly to confirm.</p>
                <div className="modal-details">
                  {[['Name', appointmentData?.name],['Phone', appointmentData?.phone],['Department', appointmentData?.department],['Date', appointmentData?.date]].map(([l,v]) => (
                    <div key={l} className="modal-row">
                      <span className="modal-row-label">{l}</span>
                      <span className="modal-row-val" style={l==='Department'?{color:'#0891b2',fontWeight:700}:{}}>{v}</span>
                    </div>
                  ))}
                </div>
                <div className="modal-wa-note">📱 Appointment message sent via WhatsApp to the hospital</div>
                <button onClick={() => setShowConfirmation(false)} className="modal-close-btn">Close</button>
              </div>
            </div>
          )}

          {/* Emergency Banner */}
          <div className="em-banner">
            🚨 24/7 Emergency Care Available &nbsp;|&nbsp; Call: <a href="tel:+919092601760" style={{color:'#fff',fontWeight:700}}>+91 90926 01760</a>
          </div>

          {/* Header */}
          <header className="header">
            <div className="header-inner">
              <div>
                <div className="logo-name">🏥 SRI DHARSON HOSPITAL</div>
                <div className="logo-sub">ORTHO HOSPITAL EXCELLENCE</div>
              </div>
              <nav className="nav">
                <button onClick={() => scroll('services')}>Services</button>
                <button onClick={() => scroll('doctors')}>Doctors</button>
                <button onClick={() => scroll('testimonials')}>Reviews</button>
                <button onClick={() => scroll('faq')}>FAQ</button>
              </nav>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <button onClick={() => scroll('appointment')} className="book-btn">Book Now</button>
                <button className="mobile-menu-btn" onClick={() => setMobileNavOpen(!mobileNavOpen)} aria-label="Menu">
                  <span style={mobileNavOpen?{transform:'rotate(45deg) translate(5px,5px)'}:{}}></span>
                  <span style={mobileNavOpen?{opacity:0}:{}}></span>
                  <span style={mobileNavOpen?{transform:'rotate(-45deg) translate(5px,-5px)'}:{}}></span>
                </button>
              </div>
            </div>
            <div className={`mobile-nav ${mobileNavOpen?'open':''}`}>
              <button onClick={() => scroll('services')}>🔧 Services</button>
              <button onClick={() => scroll('doctors')}>👨‍⚕️ Doctors</button>
              <button onClick={() => scroll('testimonials')}>⭐ Patient Reviews</button>
              <button onClick={() => scroll('faq')}>❓ FAQ</button>
              <button onClick={() => scroll('appointment')} style={{color:'#0891b2',fontWeight:700}}>📅 Book Appointment</button>
            </div>
          </header>

          {/* Hero */}
          <section style={{background:'linear-gradient(150deg,#0f172a 0%,#1e3a5f 50%,#164e63 100%)',color:'#fff',padding:'52px 0 48px',position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:'-80px',left:'-80px',width:'400px',height:'400px',background:'#22d3ee',borderRadius:'50%',filter:'blur(120px)',opacity:0.12,pointerEvents:'none'}}></div>
            <div style={{position:'absolute',bottom:'-100px',right:'-60px',width:'500px',height:'500px',background:'#3b82f6',borderRadius:'50%',filter:'blur(120px)',opacity:0.12,pointerEvents:'none'}}></div>
            <div className="container">
              <div className="hero-grid">
                <div className="hero-text">
                  <div className="hero-badge">⚡ Advanced Orthopaedic Care</div>
                  <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:'clamp(30px,6vw,58px)',fontWeight:800,lineHeight:1.08,marginBottom:'18px',letterSpacing:'-0.02em'}}>Advanced<br/>Orthopaedic<br/>Care</h2>
                  <p style={{fontSize:'clamp(14px,2vw,17px)',color:'#94a3b8',lineHeight:1.75,marginBottom:'28px',maxWidth:'500px'}}>World-class orthopedic treatment with expert surgeons, cutting-edge technology, and compassionate care. Get back to life faster.</p>
                  <div className="hero-btns">
                    <button onClick={() => scroll('appointment')} className="btn-cta">Schedule Appointment</button>
                    <button onClick={() => scroll('doctors')} className="btn-ghost">Meet Specialists</button>
                  </div>
                </div>
                <div className="hero-img">
                  <img src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1200&auto=format&fit=crop" alt="Sri Dharson Hospital" />
                </div>
              </div>
            </div>
          </section>

          {/* Stats */}
          <section style={{padding:'56px 0',background:'#fff'}}>
            <div className="container">
              <div className="stats-grid">
                {[
                  {label:'Happy Patients',value:counters.patients.toLocaleString(),icon:'👥'},
                  {label:'Successful Surgeries',value:counters.surgeries.toLocaleString(),icon:'✅'},
                  {label:'Expert Doctors',value:Math.round(counters.doctors),icon:'👨‍⚕️'},
                  {label:'Years of Experience',value:Math.round(counters.years),icon:'⭐'},
                ].map((s,i) => (
                  <div key={i} className="stat-card">
                    <div className="stat-icon">{s.icon}</div>
                    <p className="stat-num">{s.value}</p>
                    <p className="stat-label">{s.label}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Services */}
          <section id="services" style={{padding:'72px 0',background:'#f8fafc'}}>
            <div className="container">
              <div className="section-header">
                <h2>Our Services</h2>
                <p>Comprehensive orthopedic care for all bone and joint conditions</p>
              </div>
              <div className="services-grid">
                {services.map((s,i) => (
                  <div key={i} className="service-card" style={{background:s.bg}}>
                    <span className="service-icon">{s.icon}</span>
                    <h3 className="service-title">{s.title}</h3>
                    <p className="service-desc">{s.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Doctor */}
          <section id="doctors" style={{padding:'72px 0',background:'#fff'}}>
            <div className="container">
              <div className="section-header">
                <h2>Our Specialists</h2>
                <p>Highly qualified and experienced orthopedic experts</p>
              </div>
              <div className="doctor-card-wrap">
                <div className="doctor-card">
                  <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?q=80&w=800&auto=format&fit=crop" alt="Dr. D. Sridhar" />
                  <div className="doctor-info">
                    <div className="doctor-row">
                      <span className="doctor-name">Dr. D. Sridhar</span>
                      <span className="doctor-rating">★ 4.9</span>
                    </div>
                    <p className="doctor-role">Orthopaedic Surgeon</p>
                    <p className="doctor-qual">📚 D.Ortho, MS.Ortho, DNB.Ortho, Fellow.Ilizarov</p>
                    <div className="doctor-hours">🕐 Mon – Sun, 24 Hours Available</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Testimonials */}
          <section id="testimonials" style={{padding:'72px 0',background:'linear-gradient(to bottom,#eff6ff,#fff)'}}>
            <div className="container">
              <div className="section-header">
                <h2>Patient Stories</h2>
                <p>Real experiences from our satisfied patients</p>
              </div>
              <div className="testi-grid">
                {testimonials.map((t,i) => (
                  <div key={i} className="testi-card">
                    <div className="testi-header">
                      <div className="testi-avatar">{t.img}</div>
                      <div>
                        <p className="testi-name">{t.name}</p>
                        <p className="testi-condition">{t.condition}</p>
                      </div>
                    </div>
                    <div className="stars">★★★★★</div>
                    <p className="testi-text">"{t.text}"</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FAQ */}
          <section id="faq" style={{padding:'72px 0',background:'#fff'}}>
            <div className="container">
              <div className="section-header">
                <h2>Frequently Asked Questions</h2>
              </div>
              <div className="faq-wrap">
                {faqs.map((faq,i) => (
                  <div key={i} className={`faq-item ${openFaq===i?'open':''}`}>
                    <button className="faq-btn" onClick={() => setOpenFaq(openFaq===i?-1:i)}>
                      <span className="faq-q-text">{faq.q}</span>
                      <svg className="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <polyline points="6 9 12 15 18 9"/>
                      </svg>
                    </button>
                    <div className={`faq-answer ${openFaq===i?'open':''}`}>{faq.a}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Appointment */}
          <section id="appointment" style={{padding:'72px 0',background:'linear-gradient(to bottom,#0f172a,#1e3a5f)'}}>
            <div className="container">
              <div className="appt-box">
                <h2 className="appt-title">Book Your Appointment</h2>
                <p className="appt-sub">Schedule a consultation with our expert specialists</p>
                <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
                  <div className="form-row">
                    <div className="form-field">
                      <input type="text" name="name" value={formData.name} onChange={handleChange} placeholder="Full Name *" className={`appt-input ${formErrors.name?'error':''}`} />
                      {formErrors.name && <span className="err-msg">⚠ {formErrors.name}</span>}
                    </div>
                    <div className="form-field">
                      <input type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="Phone Number *" className={`appt-input ${formErrors.phone?'error':''}`} />
                      {formErrors.phone && <span className="err-msg">⚠ {formErrors.phone}</span>}
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-field">
                      <input type="email" name="email" value={formData.email} onChange={handleChange} placeholder="Email Address *" className={`appt-input ${formErrors.email?'error':''}`} />
                      {formErrors.email && <span className="err-msg">⚠ {formErrors.email}</span>}
                    </div>
                    <div className="form-field">
                      <select name="department" value={formData.department} onChange={handleChange} className={`appt-select ${formErrors.department?'error':''}`}>
                        <option value="">Select Department *</option>
                        {['Knee Replacement','Hip Replacement','Spine Care','Fracture Treatment','Sports Injury'].map(d=>(
                          <option key={d} value={d}>{d}</option>
                        ))}
                      </select>
                      {formErrors.department && <span className="err-msg">⚠ {formErrors.department}</span>}
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-field">
                      <input type="date" name="date" value={formData.date} onChange={handleChange} className={`appt-input ${formErrors.date?'error':''}`} style={{colorScheme:'dark'}} />
                      {formErrors.date && <span className="err-msg">⚠ {formErrors.date}</span>}
                    </div>
                    <select name="doctor" value={formData.doctor} onChange={handleChange} className="appt-select">
                      <option value="">Select Doctor (Optional)</option>
                      <option value="Dr. D. Sridhar">Dr. D. Sridhar</option>
                    </select>
                  </div>
                  <textarea name="message" value={formData.message} onChange={handleChange} placeholder="Describe your condition or medical history (optional)..." className="appt-textarea" />
                  <div className="form-btns">
                    <button onClick={handleSubmit} disabled={isSubmitting} className="confirm-btn">
                      {isSubmitting ? '⏳ Processing...' : '✅ Confirm Appointment'}
                    </button>
                    <button onClick={handleWhatsApp} className="wa-btn">💬 Book via WhatsApp</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="footer">
            <div className="container">
              <div className="footer-grid">
                <div>
                  <p className="footer-section-title">📍 Location</p>
                  <a href="https://maps.app.goo.gl/8bDWSszrfBM7e1mK8?g_st=aw" target="_blank" rel="noopener noreferrer" className="map-card">
                    <span className="map-icon">📍</span>
                    <p className="map-name">SRI DHARSON HOSPITAL</p>
                    <p className="map-addr">Namakkal, Tamil Nadu, India</p>
                    <span className="map-cta">Open in Google Maps</span>
                  </a>
                </div>
                <div>
                  <p className="footer-section-title">📞 Contact Info</p>
                  <div className="contact-items">
                    <div className="contact-item">
                      <p className="contact-label">Hospital Name</p>
